<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida: Anny</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b0d2b 0%, #08020f 70%, #000000 100%);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        /* Espacio estrellado */
        .universe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        /* Mensaje de Amor Central */
        .love-card {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 550px;
            background: rgba(15, 5, 25, 0.65);
            padding: 40px 30px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(142, 68, 173, 0.3);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        h1 {
            color: #ffd700;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            letter-spacing: 1px;
        }

        p {
            color: #ffffff;
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .highlight {
            color: #ffeb3b;
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: 0 0 8px rgba(255, 235, 59, 0.5);
        }

        /* Flores Amarillas Voladoras */
        .floating-flower {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            animation: drift 10s linear infinite;
        }

        .flower-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #5d4037;
            border-radius: 50%;
            z-index: 5;
            box-shadow: inset 0 0 5px #3e2723;
        }

        .flower-petals {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spin 12s linear infinite;
        }

        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            background: linear-gradient(to top, #ffca28, #ffeb3b);
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            transform-origin: bottom center;
            box-shadow: 0 0 4px rgba(255, 235, 59, 0.2);
        }

        /* Animaciones del Espacio */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-15px); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes drift {
            0% {
                transform: translateY(110vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% {
                transform: translateY(-20vh) translateX(120px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="universe" id="universe"></div>

    <div class="love-card">
        <h1>Para mi hermosa Anyeli ✨</h1>
        <p>Eres el universo entero para mí, <span class="highlight">mi linda Anny</span>. No existen estrellas suficientes en el cielo para explicar todo lo que te amo.</p>
        <p>Quiero que mires estas flores amarillas flotando en el espacio; así de infinito e inmenso es mi amor por ti. Te amo hoy y siempre. 🌻💛</p>
    </div>

    <script>
        const universe = document.getElementById('universe');

        // Generar 100 estrellas en el universo de fondo
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 3 + 's';
            universe.appendChild(star);
        }

        // Función corregida y optimizada para lanzar flores amarillas
        function launchFlower() {
            const flower = document.createElement('div');
            flower.classList.add('floating-flower');
            
            // Posición, tamaño y velocidad aleatoria
            flower.style.left = Math.random() * 95 + 'vw';
            const size = Math.random() * 35 + 45; // Tamaños variados y armoniosos
            flower.style.width = size + 'px';
            flower.style.height = size + 'px';
            flower.style.animationDuration = Math.random() * 5 + 8 + 's'; 

            flower.innerHTML = `
                <div class="flower-core" style="width: ${size * 0.3}px; height: ${size * 0.3}px;"></div>
                <div class="flower-petals"></div>
            `;

            const petalsContainer = flower.querySelector('.flower-petals');
            
            // Crear los 12 pétalos correctamente enlazados
            for (let j = 0; j < 12; j++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.width = (size * 0.16) + 'px';
                petal.style.height = (size * 0.48) + 'px';
                petal.style.transform = `translate(-50%, -100%) rotate(${j * 30}deg)`;
                petalsContainer.appendChild(petal);
            }

            document.body.appendChild(flower);

            // Eliminar la flor al salir de la pantalla
            setTimeout(() => {
                flower.remove();
            }, 14000);
        }

        // Ritmo acelerado para llenar el universo de muchísimas flores amarillas continuamente
        setInterval(launchFlower, 500);

        // Lanzar una ráfaga inicial de flores de inmediato
        for(let k = 0; k < 6; k++) { 
            setTimeout(launchFlower, k * 200); 
        }
    </script>
</body>
</html>
